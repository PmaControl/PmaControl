# Managed by the PmaControl installer.
#
# Legacy installs keep Apache DocumentRoot on /srv/www so the application stays
# reachable under /pmacontrol/. Deny the parent by default and allow only the
# PmaControl and public site checkouts; each application .htaccess then routes
# into its own public Webroot.

<Directory /srv/www>
    Require all denied
    Options -Indexes
</Directory>

<Directory /srv/www/pmacontrol>
    Require all granted
    AllowOverride All
    Options -Indexes +FollowSymLinks
</Directory>

<Directory /srv/www/site>
    Require all granted
    AllowOverride All
    Options -Indexes +FollowSymLinks
    DirectoryIndex App/Webroot/index.php
</Directory>

<Directory /srv/www/site/App/Webroot>
    Require all granted
    AllowOverride All
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php
</Directory>

<DirectoryMatch "^/srv/www(?:/.*)?/(?:\.git|\.svn|\.hg|\.bzr)(?:/|$)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/srv/www/pmacontrol/(?:App/(?!Webroot(?:/|$))|bin|ci|config_sample|configuration|data|docker|docs|documentation|install|script|sql|tests?|tmp|\.forgejo)(?:/|$)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/srv/www/site/(?:App/(?!Webroot(?:/|$))|config_sample|configuration|data|doc|docs|library|scripts|tmp|vendor|\.claude|\.codex-state)(?:/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<FilesMatch "^(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Gemfile(?:\.lock)?|Pipfile(?:\.lock)?|\.env(?:\..*)?)$">
    Require all denied
</FilesMatch>
