<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="ProxySQL icon">
  <!-- Disque-fond circulaire en rouge ProxySQL (#E31C26 ≈ couleur officielle), un peu pâli pour être lisible avec du texte par-dessus en contexte Dot3 -->
  <circle cx="16" cy="16" r="15" fill="#E31C26"/>
  <!-- "PS" monogram in white, centered. Police générique pour ne pas dépendre d'un asset externe -->
  <text x="16" y="21"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#FFFFFF"
        letter-spacing="-0.5">PS</text>
</svg>
