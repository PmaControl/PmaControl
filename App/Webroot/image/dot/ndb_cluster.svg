<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="NDB cluster">
  <!-- 4-dot cluster pattern (1 mgmd + 2 data + 1 sql), connected in a ring,
       on the NDB cluster blue background — visually different from gr.svg
       (single disc with text) so a glance distinguishes them in Dot3. -->
  <circle cx="16" cy="16" r="15" fill="#0D47A1"/>
  <!-- ring connecting the 4 nodes -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.55"/>
  <!-- mgmd (top) — orange -->
  <circle cx="16" cy="8"  r="2.6" fill="#E65100"/>
  <!-- data 1 (right) — green -->
  <circle cx="24" cy="16" r="2.6" fill="#43A047"/>
  <!-- data 2 (left) — green -->
  <circle cx="8"  cy="16" r="2.6" fill="#43A047"/>
  <!-- sql (bottom) — light blue -->
  <circle cx="16" cy="24" r="2.6" fill="#90CAF9"/>
  <!-- "NDB" tiny label -->
  <text x="16" y="18.5"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="3.6"
        font-weight="700"
        fill="#FFFFFF">NDB</text>
</svg>
