<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="NDB data node">
  <!-- Stacked-disk database silhouette in NDB green. The data node IS in-memory storage,
       so the cylinder shape (vs the disc-with-monogram of mgmd/cluster) sets it apart visually. -->
  <ellipse cx="16" cy="6"  rx="11" ry="3.5" fill="#1B5E20"/>
  <rect    x="5"  y="6"   width="22" height="20" fill="#1B5E20"/>
  <ellipse cx="16" cy="26" rx="11" ry="3.5" fill="#1B5E20"/>
  <!-- A faint highlight band hints at the "in-memory replicated" nature -->
  <ellipse cx="16" cy="13" rx="11" ry="2.2" fill="none" stroke="#2E7D32" stroke-width="0.7"/>
  <ellipse cx="16" cy="20" rx="11" ry="2.2" fill="none" stroke="#2E7D32" stroke-width="0.7"/>
</svg>
